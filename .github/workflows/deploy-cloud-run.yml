name: Deploy Cloud Run

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: ${{ vars.CLOUD_RUN_REGION || 'asia-northeast1' }}
  SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'speech-assistant-realtime' }}
  DEPLOYER_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  TWILIO_WEBHOOK_URL: ${{ vars.TWILIO_WEBHOOK_URL }}
  CALL_LOG_FIRESTORE_DATABASE_ID: ${{ vars.CALL_LOG_FIRESTORE_DATABASE_ID }}
  GOOGLE_SHEETS_SPREADSHEET_ID: ${{ vars.GOOGLE_SHEETS_SPREADSHEET_ID }}
  ADMIN_BASIC_USER: ${{ vars.ADMIN_BASIC_USER }}
  TWILIO_PUBLIC_BASE_URL: ${{ vars.TWILIO_PUBLIC_BASE_URL }}
  DTMF_GATEWAY_ENABLED: ${{ vars.DTMF_GATEWAY_ENABLED || 'false' }}
  PRACTICE_SYSTEM_REDIRECT_URL: ${{ vars.PRACTICE_SYSTEM_REDIRECT_URL }}
  DTMF_GATEWAY_TIMEOUT_S: ${{ vars.DTMF_GATEWAY_TIMEOUT_S || '2' }}
  HANDOFF_ENABLED: ${{ vars.HANDOFF_ENABLED || 'false' }}
  HANDOFF_DIAL_TIMEOUT_S: ${{ vars.HANDOFF_DIAL_TIMEOUT_S || '20' }}
  HANDOFF_WHISPER_ACCEPT_DIGIT: ${{ vars.HANDOFF_WHISPER_ACCEPT_DIGIT || '1' }}
  NOTIFY_EMAIL_ENABLED: ${{ vars.NOTIFY_EMAIL_ENABLED || 'false' }}
  NOTIFY_EMAIL_TO: ${{ vars.NOTIFY_EMAIL_TO || 'cloudia@cor-jp.com' }}
  NOTIFY_EMAIL_CC: ${{ vars.NOTIFY_EMAIL_CC || 'company@cor-jp.com,k.isayama@cor-jp.com,nagisa.terada@cor-jp.com' }}
  NOTIFY_EMAIL_FROM: ${{ vars.NOTIFY_EMAIL_FROM || 'noreply@cor-jp.com' }}

jobs:
  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment variables
        run: |
          required_vars=(
            PROJECT_ID
            DEPLOYER_SERVICE_ACCOUNT
            WORKLOAD_IDENTITY_PROVIDER
            TWILIO_WEBHOOK_URL
            CALL_LOG_FIRESTORE_DATABASE_ID
            GOOGLE_SHEETS_SPREADSHEET_ID
            ADMIN_BASIC_USER
            TWILIO_PUBLIC_BASE_URL
          )

          for name in "${required_vars[@]}"; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing deployment variable::$name is required"
              exit 1
            fi
          done

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          secret_bindings="OPENAI_API_KEY=openai-api-key:1,TWILIO_AUTH_TOKEN=twilio-auth-token:1,ADMIN_BASIC_PASSWORD=admin-basic-password:1"
          if [ "$NOTIFY_EMAIL_ENABLED" = "true" ]; then
            secret_bindings="$secret_bindings,RESEND_API_KEY=resend-api-key:1"
          fi
          if [ "$HANDOFF_ENABLED" = "true" ]; then
            secret_bindings="$secret_bindings,HANDOFF_NUMBERS=handoff-numbers:1,HANDOFF_CALLER_ID=handoff-caller-id:1"
          fi

          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --source . \
            --allow-unauthenticated \
            --min-instances 1 \
            --max-instances 5 \
            --concurrency 20 \
            --timeout 3600 \
            --cpu 1 \
            --memory 512Mi \
            --set-secrets "$secret_bindings" \
            --set-env-vars "^|^REALTIME_MODEL=gpt-realtime-2|REALTIME_REASONING_EFFORT=low|TRANSCRIPTION_MODEL=gpt-4o-transcribe|EXTRACTION_MODEL=gpt-5.4-mini|EXTRACTION_ENABLED=true|VOICE=marin|AUDIO_FORMAT=audio/pcmu|AUDIO_NOISE_REDUCTION=near_field|VAD_TYPE=server_vad|VAD_THRESHOLD=0.65|VAD_PREFIX_PADDING_MS=300|VAD_SILENCE_DURATION_MS=700|VAD_EAGERNESS=low|LOG_TRANSCRIPTS=false|LOG_REALTIME_EVENTS=false|LOG_OPENAI_RESPONSES=false|TWILIO_SIGNATURE_VALIDATION_ENABLED=true|TWILIO_WEBHOOK_URL=$TWILIO_WEBHOOK_URL|TWILIO_PUBLIC_BASE_URL=$TWILIO_PUBLIC_BASE_URL|DTMF_GATEWAY_ENABLED=$DTMF_GATEWAY_ENABLED|PRACTICE_SYSTEM_REDIRECT_URL=$PRACTICE_SYSTEM_REDIRECT_URL|DTMF_GATEWAY_TIMEOUT_S=$DTMF_GATEWAY_TIMEOUT_S|HANDOFF_ENABLED=$HANDOFF_ENABLED|HANDOFF_DIAL_TIMEOUT_S=$HANDOFF_DIAL_TIMEOUT_S|HANDOFF_WHISPER_ACCEPT_DIGIT=$HANDOFF_WHISPER_ACCEPT_DIGIT|NOTIFY_EMAIL_ENABLED=$NOTIFY_EMAIL_ENABLED|NOTIFY_EMAIL_TO=$NOTIFY_EMAIL_TO|NOTIFY_EMAIL_CC=$NOTIFY_EMAIL_CC|NOTIFY_EMAIL_FROM=$NOTIFY_EMAIL_FROM|GOOGLE_CLOUD_PROJECT=$PROJECT_ID|CALL_LOG_FIRESTORE_ENABLED=true|CALL_LOG_FIRESTORE_DATABASE_ID=$CALL_LOG_FIRESTORE_DATABASE_ID|CALL_LOG_FIRESTORE_COLLECTION=callLogs|CALL_LOG_SHEETS_ENABLED=true|GOOGLE_SHEETS_SPREADSHEET_ID=$GOOGLE_SHEETS_SPREADSHEET_ID|ADMIN_BASIC_USER=$ADMIN_BASIC_USER"
